[package]
name = "s3-wal-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "S3-backed WAL git repositories: atomic tip-bundle manifests, bare-mirror sync, and an axum smart-HTTP server."
repository = "https://github.com/ryuzcorp/crates"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true, features = ["macros"] }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"

[features]
default = ["http"]
http = ["dep:axum", "dep:bytes", "dep:http"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
