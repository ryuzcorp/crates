[package]
name = "ryuz_git"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "S3-backed WAL git: CAS manifest, immutable log, bundle/pack storage, smart HTTP v2, policy, LFS and events."
repository = "https://github.com/ryuzcorp/crates"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures = "0.3"
hex = "0.4"
hmac = "0.13"
libc = "0.2"
rand = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"

# HTTP layer
axum = { version = "0.8", features = ["macros", "http2"], optional = true }
http = { version = "1", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = [
  "catch-panic",
  "compression-gzip",
  "decompression-gzip",
  "limit",
  "set-header",
  "timeout",
  "trace",
], optional = true }

# Store backends
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1", optional = true }
google-cloud-auth = { version = "1", optional = true }
google-cloud-storage = { version = "1", optional = true }

# Operability
metrics = { version = "0.24", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"], optional = true }

# CLI
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
toml = { version = "0.9", optional = true }

[features]
default = ["http", "metrics"]
http = ["dep:axum", "dep:http", "dep:tower", "dep:tower-http"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
gcs = ["dep:google-cloud-auth", "dep:google-cloud-storage"]
metrics = ["dep:metrics"]
cli = ["dep:clap", "dep:tracing-subscriber", "dep:toml", "http"]
webhook-client = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "walgit"
path = "src/bin/walgit.rs"
required-features = ["cli"]
