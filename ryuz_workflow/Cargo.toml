[package]
name = "ryuz_workflow"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "GitHub-Actions-style CI workflows executed in containers: a strict YAML parser and a per-job container runner."
repository = "https://github.com/ryuzcorp/crates"
readme = "README.md"
keywords = ["ci", "workflow", "containers", "github-actions"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[dependencies]
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["runner"]
# The parser, model, events and outcomes need no runtime; a UI can validate a
# workflow in the browser or a build script without pulling in tokio.
runner = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
